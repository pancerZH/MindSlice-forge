[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mindslice-forge"
version = "0.1.0"
description = "Turn documents into a MindSlice workspace by driving an agent harness (Python stdlib only)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "pancerZH" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["llm", "agents", "memory", "markdown", "mindslice"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/pancerZH/MindSlice-forge"
Issues = "https://github.com/pancerZH/MindSlice-forge/issues"
MindSlice = "https://github.com/pancerZH/MindSlice"

[project.scripts]
mindslice-forge = "mindslice_forge.cli:main"

[tool.setuptools.packages.find]
include = ["mindslice_forge"]

[tool.setuptools.package-data]
mindslice_forge = ["prompts/*.md"]
